services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ceylon_secure_network
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data

  app:
    build: .
    env_file: .env.example
    ports:
      - '3000:3000'
    depends_on:
      - db

volumes:
  pg_data:
